# Development environment:  conda env create -f environment.yml
# Then:                     conda activate cue
name: cue
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - pip
  # runtime
  - textual>=1.0
  - httpx>=0.27
  - rapidfuzz>=3.0
  - tomli-w>=1.0
  # dev and build
  - pytest>=8
  - pytest-asyncio>=0.24
  - pyinstaller>=6.16
  - pip:
      - -e .
variables:
  # Keep packages from %APPDATA%\Python\Python314\site-packages out of the env (and the exe).
  PYTHONNOUSERSITE: "1"
