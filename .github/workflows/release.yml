# Builds cue.exe on Windows and publishes it as a GitHub release, when started by hand:
# Actions -> Release -> Run workflow, or `gh workflow run release.yml`.
# The tag is v<version> from cue/__init__.py; raise that version before each release.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft, to publish yourself after checking it"
        type: boolean
        default: false
      prerelease:
        description: "Mark it as a pre-release"
        type: boolean
        default: false
      dry_run:
        description: "Only test and build: keep cue.exe as a workflow artifact, make no release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Read the version
        id: version
        run: |
          version=$(python -c "import cue; print(cue.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing Cue $version as v$version"

      - name: Stop if this version is already released
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "::error::${{ steps.version.outputs.tag }} is already released. Raise __version__ in cue/__init__.py and add a CHANGELOG.md entry first."
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build cue.exe and the zip
        # Also runs `cue.exe --version` and `--smoke-test`, so a build that can't start fails here.
        run: python build/release.py

      - name: Release notes from CHANGELOG.md
        run: |
          python - "${{ steps.version.outputs.version }}" <<'EOF'
          import pathlib, re, sys
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^# ", text)[1:]
          heading, _, body = (sections[0] if sections else "").partition("\n")
          if version not in heading:
              print(f"::warning::CHANGELOG.md's newest entry ({heading.strip()!r}) doesn't mention {version}")
          pathlib.Path("notes.md").write_text((body.strip() or "See CHANGELOG.md.") + "\n", encoding="utf-8")
          EOF
          cd dist && sha256sum cue.exe "cue-${{ steps.version.outputs.version }}-win64.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Keep the build (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: cue-${{ steps.version.outputs.version }}
          path: |
            dist/cue.exe
            dist/cue-${{ steps.version.outputs.version }}-win64.zip
            dist/SHA256SUMS.txt
            notes.md

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          flags=()
          if [ "${{ inputs.draft }}" = "true" ]; then flags+=(--draft); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/cue.exe "dist/cue-$VERSION-win64.zip" dist/SHA256SUMS.txt \
            --target "${{ github.sha }}" --title "Cue $VERSION" --notes-file notes.md "${flags[@]}"
