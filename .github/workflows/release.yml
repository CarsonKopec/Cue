# Builds Cue on Windows, Linux and macOS and publishes them together as a GitHub release,
# when started by hand: Actions -> Release -> Run workflow, or `gh workflow run release.yml`.
# The tag is v<version> from cue/__init__.py; raise that version before each release.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft, to publish yourself after checking it"
        type: boolean
        default: false
      prerelease:
        description: "Mark it as a pre-release"
        type: boolean
        default: false
      dry_run:
        description: "Only test and build: keep the files as a workflow artifact, make no release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read the version
        id: version
        run: |
          version=$(python -c "import cue; print(cue.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing Cue $version as v$version"

      - name: Stop if this version is already released
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "::error::${{ steps.version.outputs.tag }} is already released. Raise __version__ in cue/__init__.py and add a CHANGELOG.md entry first."
            exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather every platform's files
        uses: actions/download-artifact@v4
        with:
          pattern: cue-*
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          python3 - "$VERSION" <<'EOF'
          import pathlib, re, sys
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^# ", text)[1:]
          heading, _, body = (sections[0] if sections else "").partition("\n")
          if version not in heading:
              print(f"::warning::CHANGELOG.md's newest entry ({heading.strip()!r}) doesn't mention {version}")
          pathlib.Path("notes.md").write_text((body.strip() or "See CHANGELOG.md.") + "\n", encoding="utf-8")
          EOF
          cd dist
          chmod +x cue-linux-* cue-macos-*
          sha256sum -- * > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Keep the files (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: cue-${{ env.VERSION }}-release
          path: |
            dist/*
            notes.md

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ inputs.draft }}" = "true" ]; then flags+=(--draft); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --target "${{ github.sha }}" --title "Cue $VERSION" \
            --notes-file notes.md "${flags[@]}"
