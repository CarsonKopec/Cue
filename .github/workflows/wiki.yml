# Copies docs/wiki/ to the GitHub wiki whenever those pages change on master, so the wiki
# changes together with the code. Edit the files, not the wiki: each copy replaces the wiki.
# GitHub creates a wiki's repository only once its first page is saved on the website,
# so save any page there once before the first run.
name: Wiki

on:
  push:
    branches: [master]
    paths: ["docs/wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docs/wiki to the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          if ! git ls-remote "$remote" >/dev/null 2>&1; then
            echo "::error::The wiki has no repository yet. Save its first page at https://github.com/${{ github.repository }}/wiki, then run this workflow again (Actions -> Wiki -> Run workflow)."
            exit 1
          fi
          git clone --depth 1 "$remote" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches docs/wiki."
            exit 0
          fi
          git commit -m "Update from ${{ github.sha }}"
          git push
