# Tests Cue, then builds and starts it on Windows, Linux and macOS. Each platform's release
# files (from build/release.py) are kept as a workflow artifact named cue-<platform>.
# Run by ci.yml on every push and pull request, and by release.yml before publishing.
name: Build

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows-x64
          - name: Linux x64
            # The oldest supported Ubuntu: a program built against an older glibc runs on more Linux systems.
            os: ubuntu-22.04
            platform: linux-x64
          - name: macOS arm64
            os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build, start and package
        # Runs the build with --version and --smoke-test, so one that can't start fails here.
        run: python build/release.py

      - uses: actions/upload-artifact@v4
        with:
          name: cue-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
