[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cue"
dynamic = ["version"]
description = "Keyboard-driven terminal media player with automatic intro/outro skipping"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
download = ["yt-dlp"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyinstaller>=6.16",
]

[project.scripts]
cue = "cue.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "cue.__version__" }

[tool.setuptools.packages.find]
include = ["cue*"]

[tool.setuptools.package-data]
"cue.player" = ["vlc_http/requests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
